services:
  postgres:
    image: postgres:18.6-alpine3.24
    container_name: salary-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - salary_management_postgres_data:/var/lib/postgresql

volumes:
  salary_management_postgres_data: