spring.application.name=salary-management
# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/salary_management}
spring.datasource.username=${DB_USERNAME:salary_app}
spring.datasource.password=${DB_PASSWORD:salary_app}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Calcutta

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Application information
management.info.env.enabled=true

info.app.name=Salary Management
info.app.description=Employee Salary Management System
info.app.version=0.0.1

# Logging
logging.level.root=INFO
logging.level.com.acme.salary=INFO

# Server
server.port=8080

app.seed.enabled=false
app.seed.employee-count=10000